name: CI

on:
  pull_request:
    branches:
      - develop
      - stage
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: frontend quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment Compose
        env:
          SHOPWARE_ENDPOINT: https://example.invalid
          SHOPWARE_ACCESS_TOKEN: validation-token
          SHOPWARE_ALLOW_MOCK_WRITES: "false"
          SHOPWARE_USE_MOCKS: "false"
          FRONT_PORT: "3000"
          APP_NETWORK: validation-network
          FRONT_STOP_GRACE_PERIOD: 30s
          FRONT_MEMORY_LIMIT: 1g
          FRONT_CPU_LIMIT: "1.5"
          FRONT_PIDS_LIMIT: "256"
        run: |
          COMPOSE_DISABLE_ENV_FILE=1 docker compose -f compose.deploy.yml config --quiet
          env -u SHOPWARE_ENDPOINT -u SHOPWARE_ACCESS_TOKEN SHOPWARE_USE_MOCKS=true COMPOSE_DISABLE_ENV_FILE=1 docker compose -f compose.deploy.yml config --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Formatting
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production Next.js build
        run: bun run build
