name: Deploy stage

on:
  pull_request:
    branches: [develop]
    paths:
      [
        .github/workflows/deploy-stage.yml,
        Dockerfile,
        compose.deploy.yml,
        next.config.ts,
        src/**,
        package.json,
        bun.lock,
      ]
  push:
    branches: [stage]

permissions:
  contents: read

jobs:
  validate:
    name: stage deployment validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum compose.deploy.yml | awk '{print $1}')" = 58d439abf9eb1184a8ac9545833fffbf1ee7b857d58e559f2781bb485d7dc0d0
          ! find . -type l -print -quit | grep -q .
          tar -czf "$RUNNER_TEMP/front.tar.gz" --exclude=.git .
          tar -tzf "$RUNNER_TEMP/front.tar.gz" | grep -Fx './Dockerfile'
          tar -tzf "$RUNNER_TEMP/front.tar.gz" | grep -Fx './package.json'
          tar -tzf "$RUNNER_TEMP/front.tar.gz" | grep -Fx './bun.lock'
          tar -tzf "$RUNNER_TEMP/front.tar.gz" | grep -Fx './next.config.ts'
          tar -tzf "$RUNNER_TEMP/front.tar.gz" | grep -Fx './src/app/api/health/route.ts'

  deploy:
    name: deploy frontend to stage
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    runs-on: ubuntu-24.04
    environment: { name: stage }
    concurrency:
      group: jvmoebel-front-stage
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      EXPECTED_DEPLOY_HOST: 85.215.147.19
      EXPECTED_COMPOSE_SHA256: 58d439abf9eb1184a8ac9545833fffbf1ee7b857d58e559f2781bb485d7dc0d0
      EXPECTED_HELPER_SHA256: 643c3bbf214283b2880cb0462ec1f87238b8a507b148f02911bc20e37f0da714
      EXPECTED_DEPLOY_KEY_FINGERPRINT: SHA256:Q3JQh8Yqz7EEoRVZXUufLmx160pk9ptugi+Zsj6qSU4
      EXPECTED_HOST_KEY_FINGERPRINT: SHA256:6BHoasAuc7ptnN/HhXaP3C/BtklHPtP85WZ2fAXcAzI
      EXPECTED_SIGNING_KEY_FINGERPRINT: SHA256:fjnORcf577FRyi8INxZ1ZlQdDQAQtC+143rAiYORqiI
      SIGNER_IDENTITY: jvmoebel-stage-front@automatonsoft
      SIGNATURE_NAMESPACE: jvmoebel-stage-front@automatonsoft
    steps:
      - uses: actions/checkout@v4
      - name: Initialize runner paths
        shell: bash
        run: |
          {
            echo "SSH_KEY_FILE=${RUNNER_TEMP}/deploy-key"
            echo "KNOWN_HOSTS_FILE=${RUNNER_TEMP}/known-hosts"
            echo "SIGNING_KEY_FILE=${RUNNER_TEMP}/signing-key"
            echo "SIGNING_PUBLIC_KEY_FILE=${RUNNER_TEMP}/signing.pub"
            echo "ALLOWED_SIGNERS_FILE=${RUNNER_TEMP}/allowed-signers"
          } >> "$GITHUB_ENV"
      - name: Validate, build and sign exact release
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_ARTIFACT_SIGNING_KEY: ${{ secrets.DEPLOY_ARTIFACT_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DEPLOY_HOST" = "$EXPECTED_DEPLOY_HOST"
          test "$DEPLOY_PORT" = 22
          test "$DEPLOY_USER" = jvmoebel-stage-deploy
          test "$DEPLOY_PATH" = /var/spool/jvmoebel/stage/front/incoming
          test "$(sha256sum compose.deploy.yml | awk '{print $1}')" = "$EXPECTED_COMPOSE_SHA256"
          ! find . -type l -print -quit | grep -q .
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          printf '%s\n' "$DEPLOY_ARTIFACT_SIGNING_KEY" | tr -d '\r' > "$SIGNING_KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$KNOWN_HOSTS_FILE"
          chmod 600 "$SSH_KEY_FILE" "$SIGNING_KEY_FILE" "$KNOWN_HOSTS_FILE"
          ssh-keygen -y -f "$SSH_KEY_FILE" > "$RUNNER_TEMP/deploy.pub"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/deploy.pub" -E sha256 | awk '{print $2}')" = "$EXPECTED_DEPLOY_KEY_FINGERPRINT"
          ssh-keygen -y -f "$SIGNING_KEY_FILE" > "$SIGNING_PUBLIC_KEY_FILE"
          test "$(ssh-keygen -lf "$SIGNING_PUBLIC_KEY_FILE" -E sha256 | awk '{print $2}')" = "$EXPECTED_SIGNING_KEY_FINGERPRINT"
          read -r key_type key_data _ < "$SIGNING_PUBLIC_KEY_FILE"
          printf '%s namespaces="%s" %s %s\n' "$SIGNER_IDENTITY" "$SIGNATURE_NAMESPACE" "$key_type" "$key_data" > "$ALLOWED_SIGNERS_FILE"
          ssh-keygen -F "$DEPLOY_HOST" -f "$KNOWN_HOSTS_FILE" >/dev/null
          ssh-keygen -lf "$KNOWN_HOSTS_FILE" -E sha256 | awk '{print $2}' | grep -Fx "$EXPECTED_HOST_KEY_FINGERPRINT"
          ARCHIVE_NAME="front-${GITHUB_SHA}.tar.gz"; MANIFEST_NAME="front-${GITHUB_SHA}.manifest"; SIGNATURE_NAME="front-${GITHUB_SHA}.manifest.sig"
          ARCHIVE_PATH="$RUNNER_TEMP/$ARCHIVE_NAME"; MANIFEST_PATH="$RUNNER_TEMP/$MANIFEST_NAME"; SIGNATURE_PATH="$RUNNER_TEMP/$SIGNATURE_NAME"
          tar -czf "$ARCHIVE_PATH" --exclude=.git .
          ARCHIVE_SHA256="$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')"
          printf 'version=1\nsha=%s\narchive=%s\nsha256=%s\n' "$GITHUB_SHA" "$ARCHIVE_NAME" "$ARCHIVE_SHA256" > "$MANIFEST_PATH"
          ssh-keygen -Y sign -f "$SIGNING_KEY_FILE" -n "$SIGNATURE_NAMESPACE" "$MANIFEST_PATH"
          ssh-keygen -Y verify -f "$ALLOWED_SIGNERS_FILE" -I "$SIGNER_IDENTITY" -n "$SIGNATURE_NAMESPACE" -s "$SIGNATURE_PATH" < "$MANIFEST_PATH" >/dev/null
          rm -f "$SIGNING_KEY_FILE"
          { echo "ARCHIVE_NAME=$ARCHIVE_NAME"; echo "MANIFEST_NAME=$MANIFEST_NAME"; echo "SIGNATURE_NAME=$SIGNATURE_NAME"; echo "ARCHIVE_PATH=$ARCHIVE_PATH"; echo "MANIFEST_PATH=$MANIFEST_PATH"; echo "SIGNATURE_PATH=$SIGNATURE_PATH"; echo "ARCHIVE_SHA256=$ARCHIVE_SHA256"; } >> "$GITHUB_ENV"
      - name: Verify server and deploy signed SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-p "$DEPLOY_PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o ForwardAgent=no)
          scp_opts=(-P "$DEPLOY_PORT" -i "$SSH_KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" -o ForwardAgent=no)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$DEPLOY_PATH' && test ! -L '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"
          test "$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sha256sum /usr/local/sbin/deploy-jvmoebel-stage-front | awk '{print \\$1}'")" = "$EXPECTED_HELPER_SHA256"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sha256sum -c /usr/local/lib/jvmoebel/front/artifact-signing.allowed_signers.sha256 >/dev/null"
          suffix="$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.uploading"
          for name in "$ARCHIVE_NAME" "$MANIFEST_NAME" "$SIGNATURE_NAME"; do ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f -- '$DEPLOY_PATH/.$name.$suffix'"; done
          scp "${scp_opts[@]}" "$ARCHIVE_PATH" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.$ARCHIVE_NAME.$suffix"
          scp "${scp_opts[@]}" "$MANIFEST_PATH" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.$MANIFEST_NAME.$suffix"
          scp "${scp_opts[@]}" "$SIGNATURE_PATH" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.$SIGNATURE_NAME.$suffix"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mv -f -- '$DEPLOY_PATH/.$ARCHIVE_NAME.$suffix' '$DEPLOY_PATH/$ARCHIVE_NAME'; mv -f -- '$DEPLOY_PATH/.$MANIFEST_NAME.$suffix' '$DEPLOY_PATH/$MANIFEST_NAME'; mv -f -- '$DEPLOY_PATH/.$SIGNATURE_NAME.$suffix' '$DEPLOY_PATH/$SIGNATURE_NAME'"
          test "$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sha256sum '$DEPLOY_PATH/$ARCHIVE_NAME' | awk '{print \\$1}'")" = "$ARCHIVE_SHA256"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n /usr/local/sbin/deploy-jvmoebel-stage-front '$GITHUB_SHA'"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test ! -e '$DEPLOY_PATH/$ARCHIVE_NAME' && test ! -e '$DEPLOY_PATH/$MANIFEST_NAME' && test ! -e '$DEPLOY_PATH/$SIGNATURE_NAME'"
      - name: Remove runner material
        if: always()
        run: rm -f -- "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE" "$SIGNING_KEY_FILE" "$SIGNING_PUBLIC_KEY_FILE" "$ALLOWED_SIGNERS_FILE" "$RUNNER_TEMP/deploy.pub"
